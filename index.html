<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>slider</title>
    <link rel="stylesheet" href="./src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="slider">
      <div class="slide active" id="asperox-animation">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" hidden>
          <symbol id="icon-twinkle">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M10.6 9.6L9 15L7.4 9.6L2 8l5.4-1.6L9 1l1.6 5.4L16 8zm6.4 4.6l4-2.2l-2.2 4l2.2 4l-4-2.2l-4 2.2l2.2-4l-2.2-4zM10 16l-1.7 3l1.7 3l-3-1.7L4 22l1.7-3L4 16l3 1.7z" />
          </symbol>
        </svg>

        <div class="bottle">
          <img src="https://hygiene247.com/wp-content/uploads/2026/11/shafaf.png"/>
        </div>

        <div class="texts">
          <p class="title">
            پاک کننده های سری 
            <em>
              Retro اسپروکس
            </em>
          </p>
          <p class="sticker">
              <svg class="trapezoid left" viewBox="-15 -32 15 32" preserveAspectRatio="none" width="1em"  >
                <g transform="scale(1,-1)">
                  <path d="M 0 0 H -3.7944 C -5.1066 0 -6.2665 0.8528 -6.6579 2.1052 L -14.7829 28.1052 C -15.3865 30.037 -13.9433 32 -11.9194 32 H 0 Z"
                    fill="currentColor"
                  />
                </g>
              </svg>
              <svg class="trapezoid right" viewBox="-15 0 15 32" preserveAspectRatio="none" width="1em" style="transform: scale(-1)">
                <path d="M 0 0 H -3.7944 C -5.1066 0 -6.2665 0.8528 -6.6579 2.1052 L -14.7829 28.1052 C -15.3865 30.037 -13.9433 32 -11.9194 32 H 0 Z"
                  fill="currentColor"
                />
              </svg>
            بر پایه سرکه سفید
          </p>
          <p class="text t1 active">
            <svg class="twinkle" viewBox="0 0 24 24">
              <use href="#icon-twinkle"/>
            </svg>
            پاک کننده سینک و دوش
          </p>
          <p class="text t2">
            <svg class="twinkle" viewBox="0 0 24 24">
              <use href="#icon-twinkle"/>
            </svg>
            پاک کننده فر، اجاق گاز و هود
          </p>
          <p class="text t3">
            <svg class="twinkle" viewBox="0 0 24 24">
              <use href="#icon-twinkle"/>
            </svg>
            پاک کننده سطوح سرامیکی و کف</p>
          <p class="text t4">
            <svg class="twinkle" viewBox="0 0 24 24">
              <use href="#icon-twinkle"/>
            </svg>
            پاک کننده چربی و آلودگی
          </p>
        </div>

        <video muted>
          <source src="https://hygiene247.com/wp-content/uploads/2026/11/VID_20261108_115232_249.mp4" type="">
        </video>

      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
