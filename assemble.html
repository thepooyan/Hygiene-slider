<style>
  :root {
    --shake: 2deg;
    --scale: 1;
    --slider-height: calc(30rem * var(--scale));
  }
  .slider_container {
    height: var(--slider-height);
    margin-bottom: 2rem;
    display: flex;
    justify-content: center;
    margin-top: -3.2rem;

    @media (max-width: 1025px) {
      --slider-height: 20rem;
    }
    @media (max-width: 769px) {
      --slider-height: 15rem;
    }
  }
  #slider {
    direction: rtl;
    display: flex;
    position: relative;
    height: 100%;
    overflow: hidden;
    position: absolute;
    width: 100vw;

    .slide {
      position: absolute;
      user-select: none;
      transition: all .2s;
      width: 100%;
      height: 100%;

      &:not(.active) {
        opacity: 0;
        filter: blur(.5rem) brightness(0.5);
        scale: .99;
        visibility: hidden;
      }
    }
    .controls {
      .left,.right {
        position: absolute;
        z-index: 20;
        inset-block: 0;
        margin: auto;
        font-size: 2rem;
        background: #3f3f3f78;
        color: white;
        padding: 1.6rem .5rem;
        cursor: pointer;
        --radius: 1rem;
        border-radius: 0 var(--radius) var(--radius) 0;
        opacity: .8;
        &:hover {
          opacity: 1;
        }
      }
      .left {
        left: 0;
      }
      .right {
        rotate: 180deg;
        right: 0;
      }
    }

    transition: filter .2s;
    &:not(.active) {
      filter: grayscale(1) blur(9px);
    }
  }

  .retro-banner {
    background: url(https://hygiene247.com/wp-content/uploads/2026/11/Teal-and-Cream-Flowing-Gradient-Waves.webp) no-repeat;
    background-size: 100% auto;
    background-position: 0 58%;
    height: calc(25rem * var(--scale));
    overflow-x: hidden;
    display: flex;
    flex-direction: row-reverse;
    width: 100%;
    --green: #03383D;
    --yellow: #FDC833;
    --red: #BF0B0C;
    --font-scale: 1;
    position: relative;

    &::before {
      content: "";
      background: url(https://hygiene247.com/wp-content/uploads/2026/11/Potted-Greenery-on-Marble-Countertop.webp) no-repeat;
      background-size: contain;
      display: block;
      position: absolute;
      inset: 0;
      z-index: 10;
      mask-image: linear-gradient(to left, transparent 64%, black 77%);
    }

    .video {
      flex: 20%;
      margin: calc(.6rem * var(--scale));
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;

      video {
        max-height: 100%;
        max-width: 100%;
        width: max-content;
        height: max-content;
        border: 5px solid white;
        background: white;
        aspect-ratio: 2/2.5;
        border-radius: .5rem;
        display: block;
      }
    }

    .bottle {
      flex: 13%;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      position: relative;

      img {
        margin-bottom: calc(2rem * var(--scale));
        width: calc(8rem * var(--scale));
        height: calc(22rem * var(--scale));
        filter: drop-shadow(2px 4px 6px #00000080);
        position: absolute;
        left: calc(5rem * var(--scale));
        transition: all .4s, opacity .2s;

        &.active {
          animation: shake .4s 1s;
        }

        &:not(.active) {
          opacity: 0;
          scale: .8;
          transform-origin: bottom;
          translate: 5rem 0;
        }
      }
    }

    .center {
      display: flex;
      flex: auto;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      z-index: 20;

      .text-placeholder {
        display: flex;
        justify-content: center;
        gap: .5rem;
        position: relative;

        .text {
          position: absolute;
          width: max-content;
          text-align: center;
          font-weight: bold;
          background: white;
          font-size: calc(var(--font-scale) * 1rem);
          color: var(--green);
          padding: calc(.3rem * var(--scale)) calc(1rem * var(--scale));
          padding-right: calc(.5rem * var(--scale));
          border-radius: 20rem;
          border: calc(3px * var(--scale)) solid var(--green);
          display: flex;
          justify-content: center;
          align-items: center;
          gap: .5rem;

          .twinkle {
            color: var(--yellow);
            width: calc(1.7rem * var(--font-scale));
            animation: twinkle 1s alternate infinite;
          }

          transition: .2s;

          &:not(.active) {
            opacity: 0;
            translate: 9px 0;
          }
        }
      }

      .title {
        text-align: center;
        color: var(--green);
        font-size: calc(var(--font-scale) * 3rem);
        font-weight: 800;
        -webkit-text-stroke: calc(15px * var(--font-scale)) white;
        paint-order: stroke fill;
        letter-spacing: -2px;
        filter: drop-shadow(8px 10px 2px #00000045);
        line-height: 1.2;
        rotate: -3deg;

        em {
          display: block;
          color: var(--red);
          font-style: unset;
        }
      }

      .sticker {
        background: var(--yellow);
        color: var(--green);
        font-weight: bold;
        padding: calc(.5rem * var(--scale)) 0;
        padding-right: calc(3px * var(--scale));
        transform: perspective(500px) rotateY(6deg);
        rotate: -3deg;
        font-size: calc(var(--font-scale) * 2rem);
        font-weight: 900;
        letter-spacing: -2px;
        text-shadow: 1px 1px 3px #00000075;

        .trapezoid {
          position: absolute;
          color: var(--yellow);
          top: 0;
          height: 100%;

          &.left {
            right: calc(100% - 1px);
          }

          &.right {
            left: calc(100% - 1px);
          }
        }
      }
    }

    &.fairy {
      &::before {
        content: unset;
      }
      .bottle {
        align-items: center;
        img {
          width: 140%;
          height: unset;
          max-width: 30rem;
          transform: perspective(500px) rotateY(16deg) rotateX(10deg);
          animation: unset;
          cursor: pointer;
          left: 0;

          &:hover {
            transform: none;
          }
        }
      }

      @media (max-width: 1200px) {}
      @media (max-width: 1025px) {
        .bottle {display: none;}
      }
      @media (max-width: 769px) {}
      @media (max-width: 481px) {}
    }


    @media (max-width: 1200px) {
      --font-scale: .8;
      --scale: .8;
    }

    @media (max-width: 1025px) {
      &::before {
        content: unset;
      }
      .bottle {
        flex: 1%;

        img {
          left: -2rem;
          bottom: -3rem;
          rotate: 25deg;
          animation: unset !important;
        }
      }
      .center {
        gap: .5rem
      }
    }
    @media (max-width: 769px) {
      --font-scale: .5;
      height: unset;
      background-size: cover;
      padding: 1rem;
      gap: .3rem;
      .center {
        gap: 0;
        flex: 22%;
        .text-placeholder {
          height: 2.4rem;
          .text {
            border-width: 2px;
            font-size: .6rem;
          }
        }
      }
      .bottle {
        display: none;
      }
      .video {
        margin: auto;
        max-width: 20rem;
        max-height: 100%;

        video {
          max-height: 13.3rem;
        }
      }
    }
    @media (max-width: 481px) {
    }
  }

  #welcome {
    video {
      display: block;
      margin: auto;
      height: 100%;
      width: 100%;
      max-width: max-content;
      mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 2%,
        black 98%,
        transparent 100%
      );
    }
    background: #FDE6D1;
  }

  @keyframes twinkle {
    0% {
      scale: 1;
    }
    100% {
      scale: 1.3;
    }
  }
  @keyframes shake {
    0% {
      rotate: 0;
    }
    20% {
      rotate: var(--shake);
    }
    40% {
      rotate: calc(-1 * var(--shake));
    }
    60% {
      rotate: var(--shake);
    }
    80% {
      rotate: calc(-1 * var(--shake));
    }
    100% {
      rotate: 0;
    }
  }
</style>

<script>
const InitUniqueTimeout = () => {
  let databse = new Map();
  return (fn, timeout, id) => {
    const already = databse.get(id)
    if (already) clearTimeout(already)
    let obj = setTimeout(fn, timeout)
    databse.set(id, obj)
  }
}

const uniqe_timeout = InitUniqueTimeout()

window.addEventListener("load", () => {
  setTimeout(initSlider, 0)
})

const initSlider = () => {
  const slider = document.getElementById("slider")
  if (!slider) throw new Error("slider not found")

  const next = slider.querySelector(".js-next")
  const prev = slider.querySelector(".js-prev")
  const slides = Array.from(slider.querySelectorAll(".slide"))

  const welcome_video = slider.querySelector("#welcome")?.querySelector("video")

  const asperox = slider.querySelector("#asperox-animation");
  if (!asperox) throw new Error("asperox not found")
  const video = asperox.querySelector("video")
  if (!video) throw new Error("asperox has no video")
  const fairy = slider.querySelector("#fairy-animation video");
  const texts = asperox.querySelectorAll(".text")
  const bottles = asperox.querySelectorAll(".bottle img")
  const timing = [0,2.5,3,2,2.5];

  const start_fairy_animation = () => {
    if (fairy) {
      fairy.currentTime = 0
      fairy.play()
    }
  }
  const start_asperox_animation = () => {
    video.currentTime = 0
    video?.play();

    timing.reduce((prev, current, index) => {
      uniqe_timeout(() => {
        const text = Array.from(texts).at(index-1);
        const bottle = Array.from(bottles).at(index-1);
        texts.forEach(t => t.classList.remove("active"))
        bottles.forEach(t => t.classList.remove("active"))
        text?.classList.add("active")
        bottle?.classList.add("active")
      }, prev * 1000, index)
      return prev + current
    })
  }
  start_asperox_animation()

  let slider_control = new class {
    index = 0
    timer = null
    next_index = () => this.index = (this.index + 1) % slides.length 
    prev_index = () => this.index = (this.index - 1) % slides.length 
    show_active_slide = () => {
      slides.forEach(s => s.classList.remove("active"))
      slides.at(this.index)?.classList.add("active")
      slides.at(this.index)?.querySelectorAll("[data-src]").forEach(s => {
        if (s instanceof HTMLSourceElement && s.parentNode instanceof HTMLMediaElement) {
          s.parentNode.load()
        }
        s.setAttribute("src", s.getAttribute("data-src") || "")
        s.removeAttribute("data-src")
      })
    }
    next = () => { this.next_index(); this.show_active_slide(); this.slide_cleanup() }
    prev = () => { this.prev_index(); this.show_active_slide(); this.slide_cleanup() }
    slide_cleanup = () => {
      if (this.timer) clearTimeout(this.timer)
      const current_slide = slides.at(this.index);
      // handle duration
      const duration = current_slide?.getAttribute("data-duration");
      if (duration) {
        this.timer = setTimeout(() => {
          this.next()
        }, parseInt(duration) * 1000)
      }
      // handle asperox video play
      if (current_slide?.id === "asperox-animation") {
        start_asperox_animation()
      }
      if (current_slide?.id === "fairy-animation") {
        start_fairy_animation()
      }
      if (current_slide?.id === "welcome") {
        if (welcome_video) {
          welcome_video.currentTime = 0
          welcome_video.play()
        }
      }
    }
  }

  next?.addEventListener("click", () => slider_control.next() )
  prev?.addEventListener("click", () => slider_control.prev() )

  const initial_duration = parseInt(asperox.getAttribute("data-duration") ?? "10");
  slider_control.timer = setTimeout(() => { slider_control.next() }, initial_duration * 1000)
  asperox.querySelectorAll("[data-src]").forEach(s => {
    s.setAttribute("src", s.getAttribute("data-src") || "")
    s.removeAttribute("data-src")
  })
  slider.classList.add("active")
}
</script>
